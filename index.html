AAR (hooggeschoolden bijna 30 %, laaggeschoolden 14 %).</li><li><strong>Antwoord: </strong>3. Er zijn meer vrijwilligers nodig in het bestuur van verenigingen. → DAT STAAT NIET IN DE TEKST.</li><li><strong>Antwoord: </strong>4. Een vrijwilliger werkt gemiddeld vier uur en zestien minuten per maand. → NIET WAAR (per week, niet per maand).</li><li><strong>Antwoord: </strong>5. Vrouwen doen meer vrijwilligerswerk dan mannen. → NIET WAAR (mannen 23 %, vrouwen 17 %).</li></ul><p><strong>Oefening 6.3. </strong>Wat vind je van deze tekst?</p><ul><li><strong>Antwoord: </strong>Ik vind deze tekst interessant. Door deze tekst te lezen heb ik iets bijgeleerd.</li></ul><p><em>   (</em><em>öğrenci</em><em> </em><em>görüşü</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>— Pagina 20–21: Kies vrijwilligerswerk (Oefening 1) — schrijfoefening —</strong></p><p><strong>Oefening 1. </strong>Lees de drie vacatures en kies het vrijwilligerswerk dat je het liefst wil doen.</p><ul><li><strong>Antwoord: </strong>Ik wil het liefst werken als begeleider bij de zomerschool, want ik werk graag met kinderen. Ik kan niet werken als vervoersvrijwilliger, want ik heb geen rijbewijs.</li></ul><p><em>   (</em><em>hayali</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>— Pagina 22–23: E-mail + brochures + flyers (Oefening 2, 3, 4) — schrijfoefening —</strong></p><p><strong>Oefening 2/3/4. </strong>Schrijf een korte e-mail over je vrijwilligerswerk en kies een kamp / school. Örnek e-mail:</p><ul><li><strong>Antwoord: </strong>Hoi,\nIk doe nu vrijwilligerswerk in een buurthuis. Ik zet koffie en praat met de bezoekers. Het is heel leuk, want ik oefen zo mijn Nederlands. Kom je eens langs?\nGroetjes,\n(naam)</li></ul><p><em>   (hayali – örnek)</em></p>", "<h2>DEEL 2 – Informeer je!</h2><p><strong>— Pagina 26–27: Artikel: Allergisch of Intolerant? (Oefening 1 en 2) —</strong></p><p><strong>Oefening 1.1. </strong>Welk probleem hebben steeds meer mensen?</p><ul><li><strong>Antwoord: </strong>Steeds meer mensen hebben een voedselallergie of een voedselintolerantie.</li></ul><p><strong>Oefening 1.2. </strong>Wat wil de overheid?</p><ul><li><strong>Antwoord: </strong>De overheid wil de allergische consument duidelijk informeren om zijn veiligheid te garanderen.</li></ul><p><strong>Oefening</strong><strong> 1.3. </strong>Hoe gebeurt dat?</p><ul><li><strong>Antwoord: </strong>Met een nieuw pictogram voor restaurants en winkels, en op de etiketten moet staan welke van de veertien allergenen aanwezig zijn.</li></ul><p><strong>Oefening 2. </strong>Vat de tekst samen in twee zinnen (en dus / daarom).</p><ul><li><strong>Antwoord: </strong>Steeds meer mensen hebben een voedselallergie of -intolerantie, en dus wil de overheid hen goed informeren. Daarom is er een nieuw pictogram en moeten de allergenen op het etiket staan.</li></ul><p><strong>— Pagina 28–29: Europese regels voor voedseletiketten (Oefening 3) + etiketten (Oefening 4) —</strong></p><p><strong>Oefening 3.1. </strong>Welke informatie moet je zeker lezen als je allergisch of intolerant bent?</p><ul><li><strong>Antwoord: </strong>De lijst met ingrediënten en de allergenen (die duidelijk op het etiket moeten staan).</li></ul><p><strong>Oefening 3.2. </strong>Welke informatie moet je lezen als je wil vermageren?</p><ul><li><strong>Antwoord: </strong>De energiewaarde (de calorieën) en de hoeveelheid vetten en suikers per 100 g.</li></ul><p><strong>Oefening 3.3. </strong>Kan je op de nieuwe etiketten vinden hoeveel zout, suiker en vet er precies in zit?</p><ul><li><strong>Antwoord: </strong>a) Ja.</li></ul><p><strong>Oefening 4. </strong>Lees de voedseletiketten (allergisch voor soja, noten en melk). Wat mag je (niet) eten?</p><ul><li><strong>Antwoord: </strong>Royco soep: NIET eten (kan sporen van soja bevatten).</li><li><strong>Antwoord: </strong>Nutella: NIET eten (hazelnoten = noten, en soja).</li><li><strong>Antwoord: </strong>Aardbeienconfituur: mag je eten (geen soja/noten/melk).</li><li><strong>Antwoord: </strong>Amandelbrood: NIET eten (melk, amandelen = noten, sporen van soja).</li></ul><p><strong>— Pagina 30–31: Etiketten (Oefening 4) + Kom op tegen Kanker (Oefening 5 en 6) —</strong></p><p><strong>Oefening 4. </strong>Welke producten mag je eten (allergisch voor soja/noten/melk)?</p><ul><li><strong>Antwoord: </strong>Ebly (voorgekookte tarwe – bevat gluten, maar geen soja/noten/melk) en de groentebouillon en de mayonaise mag je eten. De gekookte ham NIET (kan sporen van melk bevatten).</li></ul><p><strong>Oefening 5.1. </strong>Wie heeft de tekst geschreven?</p><ul><li><strong>Antwoord: </strong>Het Kom-op-tegen-kanker-team.</li></ul><p><strong>Oefening 5.2. </strong>Wat gaat er gebeuren in het derde weekend van september?</p><ul><li><strong>Antwoord: </strong>Dan is het Plantjesweekend: vrijwilligers verkopen azalea’s (plantjes).</li></ul><p><strong>Oefening 5.3. </strong>Waarom heeft Kom op tegen Kanker deze tekst geschreven?</p><ul><li><strong>Antwoord: </strong>Om vrijwilligers te zoeken die plantjes willen verkopen.</li></ul><p><strong>Oefening 6. </strong>Vat de tekst samen in één zin (en).</p><ul><li><strong>Antwoord: </strong>Kom op tegen Kanker organiseert in het derde weekend van september het Plantjesweekend en zoekt vrijwilligers om azalea’s te verkopen.</li></ul><p><strong>— Pagina 32–33: Artikel: Opeens kwam de ziekte dichtbij (Oefening 7, 8 en 9) —</strong></p><p><strong>Oefening 7.1. </strong>Wie heeft de tekst geschreven?</p><ul><li><strong>Antwoord: </strong>Paul Verbiest, Vriend van de Stichting.</li></ul><p><strong>Oefening 7.2. </strong>Wat is er gebeurd met zijn vrouw?</p><ul><li><strong>Antwoord: </strong>Zijn vrouw Hilde kreeg borstkanker.</li></ul><p><strong>Oefening</strong><strong> 7.3. </strong>Wat doet Paul?</p><ul><li><strong>Antwoord: </strong>Hij is Vriend van de Stichting tegen Kanker en stort elke maand € 10.</li></ul><p><strong>Oefening 8. </strong>Vat de tekst samen in één zin (daarom).</p><ul><li><strong>Antwoord: </strong>De vrouw van Paul Verbiest kreeg borstkanker, daarom is hij nu Vriend van de Stichting en stort hij elke maand € 10.</li></ul><p><strong>Oefening 9. </strong>Wat vind jij van de acties van Kom op tegen Kanker? (internetforum)</p><ul><li><strong>Antwoord: </strong>Ik vind de acties van Kom op tegen Kanker een heel goed idee. Ik vind het belangrijk dat er geld naar onderzoek gaat, want zo kunnen we zieke mensen helpen.</li></ul><p><em>   (</em><em>hayali</em><em> </em><em>görüş</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>— Pagina 34–35: Doe een oproep! (Oefening 11) — schrijfoefening —</strong></p><p><strong>Oefening 11. </strong>Schrijf een oproep (e-mail naar je medecursisten). Örnek:</p><ul><li><strong>Antwoord: </strong>Beste medecursisten,\nWij willen volgend jaar een actie organiseren voor Kom op tegen Kanker. Wij gaan koekjes bakken en verkopen. Wij zoeken mensen om mee te helpen. Ik vind dit belangrijk, want zo steunen we het onderzoek tegen kanker. Wil jij meehelpen? Mail dan naar (e-mail).\nMet vriendelijke groet,\n(naam)</li></ul><p><em>   (</em><em>hayali</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>— Pagina 36–37: Krantenartikel: Geefbereidheid (Oefening 12) —</strong></p><p><strong>Oefening 12.1. </strong>Welke titel past het best bij het artikel?</p><ul><li><strong>Antwoord: </strong>b) Belgen geven steeds meer geld aan goede doelen. (De geefbereidheid stijgt elk jaar.)</li></ul><p><strong>Oefening 12.2. </strong>Waarom geven de Belgen geld aan goede doelen?</p><ul><li><strong>Antwoord: </strong>c) Om de wereld beter te maken. (Zeven op tien ondervraagden zeggen dat.)</li></ul><p><strong>Oefening 12.3. </strong>De Belg geeft het liefst geld aan acties zoals Kom op tegen Kanker. Klopt dat?</p><ul><li><strong>Antwoord: </strong>Ja. Bovenaan de keuzelijst staan goede doelen rond “gezondheid en medisch onderzoek” (39 %).</li></ul><p><strong>Oefening 12.4. </strong>Wat vind je van deze tekst?</p><ul><li><strong>Antwoord: </strong>Ik vind deze tekst interessant. Door deze tekst te lezen heb ik iets bijgeleerd.</li></ul><p><em>   (</em><em>öğrenci</em><em> </em><em>görüşü</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>— Pagina 38–39: Plop-koeken (Oefening 1) + Colruyt-folder (Oefening 3) —</strong></p><p><strong>Oefening 1. </strong>Ga je de Plop-koeken kopen (je kind is allergisch voor melk)?</p><ul><li><strong>Antwoord: </strong>b) Nee. Waarom niet? — Omdat de koeken melkpoeder bevatten en mijn kind allergisch is voor melk.</li></ul><p><strong>Oefening 3.1. </strong>Welke organisatie kan je samen met Colruyt steunen?</p><ul><li><strong>Antwoord: </strong>De Voedselbanken.</li></ul><p><strong>Oefening 3.2. </strong>Wat kan je doen?</p><ul><li><strong>Antwoord: </strong>Je kan een of beide schenkingsbonnen afgeven aan de kassa (een voedselpakket van € 6 of melk van € 2,60 schenken).</li></ul><p><strong>Oefening 3.3. </strong>Wat doet de winkel?</p><ul><li><strong>Antwoord: </strong>De winkel (Colruyt) neemt de geschonken producten uit de rekken en geeft ze aan de Voedselbanken.</li></ul><p><strong>Oefening 3.4. </strong>Wie kan je zo helpen?</p><ul><li><strong>Antwoord: </strong>De minderbedeelden (mensen met weinig geld).</li></ul><p><strong>Oefening 3.5. </strong>Vat de folder samen in drie zinnen (als).</p><ul><li><strong>Antwoord: </strong>Als je bij Colruyt winkelt, kan je een schenkingsbon afgeven. Colruyt neemt de producten uit de rekken en geeft ze aan de Voedselbanken. Zo help je de minderbedeelden.</li></ul><p><strong>— Pagina 40–41: Oproep via e-mail/Facebook (Oefening 4) — schrijfoefening —</strong></p><p><strong>Oefening 4. </strong>Roep je vrienden op om mee te doen aan een goed doel. Örnek:</p><ul><li><strong>Antwoord: </strong>Beste vrienden,\nWij willen geld inzamelen voor het goede doel. Wij zoeken mensen om mee te helpen op de markt. Ik vind het belangrijk om zieke mensen te helpen. Wil jij meedoen? Mail dan naar mij!\nGroetjes,\n(naam)</li></ul><p><em>   (hayali – örnek)</em></p>", "<h2>DEEL 3 – Het spijt me!</h2><p><strong>— Pagina 44: Lees de sms’jes – M of C? (Oefening 1) —</strong></p><p><strong>Oefening 1. </strong>Wie heeft de sms gestuurd? M (medecursist), C (collega) of M en C?</p><ul><li><strong>Antwoord: </strong>SMS 1 (“Ik kan vanavond niet naar de les komen … Kan je Christine verwittigen?”) → M (het gaat over de les).</li><li><strong>Antwoord: </strong>SMS 2 (“Ik kom vanavond niet, ik moet werken tot 22 uur.”) → C (het gaat over het werk).</li><li><strong>Antwoord: </strong>SMS 3 (“Ik sta in de file! Ik zal wat later zijn.”) → M en C (kan voor de les én voor het werk).</li><li><strong>Antwoord: </strong>SMS 4 (“Ik ben ziek. Ik kom vandaag niet werken.”) → C (het gaat over het werk).</li></ul><p><strong>Oefening 2. </strong>Kies vier verschillende reacties bij de sms’jes.</p><ul><li><strong>Antwoord: </strong>SMS 1 (tandarts, “kan je verwittigen?”) → “Dat zal ik doen!”</li><li><strong>Antwoord: </strong>SMS 2 (werken tot 22 uur) → “Spijtig!”</li><li><strong>Antwoord: </strong>SMS 3 (file, later) → “Oké!” / “Tot straks!”</li><li><strong>Antwoord: </strong>SMS 4 (ziek) → “Beterschap!”</li></ul><p><strong>Oefening 3. </strong>Je zal wat later zijn. Schrijf de excuses onder de tekeningen.</p><ul><li><strong>Antwoord: </strong>1 (file) → Ik sta in de file.</li></ul><p><em>   </em><em>(</em><em>kısmen</em><em> </em><em>hayali</em><em> – </em><em>örnek</em><em>)</em></p><ul><li><strong>Antwoord: </strong>2 (aan de deur / babysit) → Ik moet nog op de babysit wachten.</li></ul><p><em>   </em><em>(</em><em>kısmen</em><em> </em><em>hayali</em><em> – </em><em>örnek</em><em>)</em></p><ul><li><strong>Antwoord: </strong>3 (werken) → Ik moet nog werken.</li></ul><p><em>   </em><em>(</em><em>kısmen</em><em> </em><em>hayali</em><em> – </em><em>örnek</em><em>)</em></p><ul><li><strong>Antwoord: </strong>4 (trein/spoor) → Mijn trein heeft vertraging.</li></ul><p><em>   </em><em>(</em><em>kısmen</em><em> </em><em>hayali</em><em> – </em><em>örnek</em><em>)</em></p><ul><li><strong>Antwoord: </strong>5 (bus) → Ik heb de bus gemist.</li></ul><p><em>   (</em><em>kısmen</em><em> </em><em>hayali</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>— Pagina 46: Je kan niet komen – excuses (Oefening 4) —</strong></p><p><strong>Oefening 4. </strong>Schrijf de excuses onder de foto’s.</p><ul><li><strong>Antwoord: </strong>1 (ziek in bed) → Ik ben ziek.</li><li><strong>Antwoord: </strong>2 (tandarts) → Ik moet naar de tandarts.</li><li><strong>Antwoord: </strong>3 (baby + telefoon) → Ik heb geen babysit.</li><li><strong>Antwoord: </strong>4 (fietsslot om boom, fiets weg) → Mijn fiets is gestolen.</li><li><strong>Antwoord: </strong>5 (ziek kind op schoot) → Mijn kind is ziek.</li><li><strong>Antwoord: </strong>6 (bij de dokter) → Ik moet naar de dokter.</li><li><strong>Antwoord: </strong>7 (auto met open motorkap) → Mijn auto is kapot.</li></ul><p><strong>Oefening 5. </strong>Kies een rol en situatie en schrijf een sms. Örnek (samen met collega rijden):</p><ul><li><strong>Antwoord: </strong>Hoi, ik kan vandaag niet meerijden, want mijn auto is kapot. Sorry! — Reactie: Oké, geen probleem. Tot morgen!</li></ul><p><em>   (hayali – örnek)</em></p><p><strong>— Pagina 48–49: Artikel: Sms steeds populairder (Oefening 6) + vul de sms aan (Oefening 1) —</strong></p><p><strong>Oefening 6.1. </strong>Welke titel past het best bij dit artikel?</p><ul><li><strong>Antwoord: </strong>b) Sms steeds populairder. (Het gaat over sms’en thuis én op het werk.)</li></ul><p><strong>Oefening 6.2–6.4. </strong>Waarom / welke tekst / welke sms stuur jij? (eigen antwoord)</p><ul><li><strong>Antwoord: </strong>Ik stuur het vaakst een sms om snel iets te laten weten, bijvoorbeeld “Ik ben onderweg” of “Ik kom wat later”.</li></ul><p><em>   (</em><em>kişisel</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>Oefening 1. </strong>Vul de sms aan (je komt later of je kan niet komen).</p><ul><li><strong>Antwoord: </strong>(file) Ik zal wat later zijn, want ik sta in de file.</li><li><strong>Antwoord: </strong>(babysit) Ik zal wat later zijn, want ik moet nog op de babysit wachten.</li><li><strong>Antwoord: </strong>(werken) Ik zal wat later zijn, want ik moet nog werken.</li><li><strong>Antwoord: </strong>(trein) Ik zal wat later zijn, want mijn trein heeft vertraging.</li><li><strong>Antwoord: </strong>(ziek) Ik kan niet komen, want ik ben ziek.</li><li><strong>Antwoord: </strong>(tandarts) Ik kan niet komen, want ik moet naar de tandarts.</li></ul><p><strong>— Pagina 50–51: Vul de sms aan + schrijf een sms (Oefening 1 en 2) —</strong></p><p><strong>Oefening 1. </strong>Ik kan niet komen, want …</p><ul><li><strong>Antwoord: </strong>(geen babysit) … want ik heb geen babysit.</li><li><strong>Antwoord: </strong>(fiets gestolen) … want mijn fiets is gestolen.</li><li><strong>Antwoord: </strong>(auto kapot) … want mijn auto is kapot.</li><li><strong>Antwoord: </strong>(ziek kind) … want mijn kind is ziek.</li></ul><p><strong>Oefening 2. </strong>Schrijf een sms om te verwittigen (kies een situatie). Örnek:</p><ul><li><strong>Antwoord: </strong>Hoi, ik neem vandaag niet samen de bus, want ik heb de bus gemist. Ik zal wat later op de les zijn. Tot straks!</li></ul><p><em>   (</em><em>hayali</em><em> – </em><em>örnek</em><em>)</em></p>", "<h2>DEEL 4 – Post!</h2><p><strong>— Pagina 54: Lees de </strong><strong>inbox</strong><strong> (Oefening 1) —</strong></p><p><strong>Oefening 1.1. </strong>Hoeveel e-mails heeft Sandra nog niet gelezen?</p><ul><li><strong>Antwoord: </strong>Sandra heeft 6 e-mails nog niet gelezen. (Postvak IN: 6)</li></ul><p><strong>Oefening 1.2. </strong>Welke ongelezen e-mail is vermoedelijk reclame?</p><ul><li><strong>Antwoord: </strong>De e-mail van CenterParcs (“Ontdek het geheim van de zomer …”) is vermoedelijk reclame. Ook de e-mail van Colruyt kan reclame zijn.</li></ul><p><strong>— Pagina 55: Lees de e-mail – </strong><strong>Fakkelteater</strong><strong> (Oefening 2) —</strong></p><p><strong>Oefening 2.1. </strong>Wat moet Sandra doen voor ze naar het theater gaat?</p><ul><li><strong>Antwoord: </strong>Sandra moet het e-ticket uit de bijlage afdrukken en meenemen naar de voorstelling.</li></ul><p><strong>Oefening 2.2. </strong>Wat moet ze doen als ze niet kan printen?</p><ul><li><strong>Antwoord: </strong>Dan moet ze het transactienummer meenemen naar de kassa.</li></ul><p><strong>— Pagina 56: Lees de e-mail – school (Oefening 3) —</strong></p><p><strong>Oefening 3.1. </strong>Wat moet Sandra doen?</p><ul><li><strong>Antwoord: </strong>Sandra moet een ziektebriefje aan de oogarts vragen.</li></ul><p><strong>Oefening 3.2. </strong>Wat moet Niels doen wanneer hij terug naar school gaat?</p><ul><li><strong>Antwoord: </strong>Niels moet het ziektebriefje afgeven op het leerlingensecretariaat.</li></ul><p><strong>— Pagina 57: Lees de e-mail – Pearle Opticiens (Oefening 4) —</strong></p><p><strong>Oefening 4. </strong>Wat moet Sandra doen? (Omcirkel de juiste letter.)</p><ul><li><strong>Antwoord: </strong>e) Ze moet niets doen. (De e-mail is een uitnodiging voor een gratis oogcontrole; het is niet verplicht. Ze mag ook b) een afspraak maken als ze wil.)</li></ul><p><strong>— Pagina 58–60: Lees de e-mail + bijlage – VDAB (Oefening 5) —</strong></p><p><strong>Oefening 5.1. </strong>De e-mail met de brief in bijlage is …</p><ul><li><strong>Antwoord: </strong>c) een uitnodiging voor een gesprek.</li></ul><p><strong>Oefening 5.2. </strong>De VDAB stuurt deze e-mail …</p><ul><li><strong>Antwoord: </strong>c) omdat Sandra op gesprek moet komen bij de VDAB.</li></ul><p><strong>Oefening 5.3. </strong>Wanneer en hoe laat is de afspraak?</p><ul><li><strong>Antwoord: </strong>De afspraak is op maandag 6 juli om 14.00 uur.</li></ul><p><strong>Oefening 5.4. </strong>Waar is de afspraak?</p><ul><li><strong>Antwoord: </strong>Bij de VDAB in Boom, J. Van Cleemputplein 4.00/1, 2850 Boom.</li></ul><p><strong>Oefening 5.5. </strong>Moet Sandra naar de afspraak gaan?</p><ul><li><strong>Antwoord: </strong>a) Ja. Ze is verplicht om op de uitnodiging in te gaan.</li></ul><p><strong>Oefening 5.6. </strong>Sandra heeft op 6 juli om 14 uur een afspraak met haar advocaat. Wat moet ze zeker doen?</p><ul><li><strong>Antwoord: </strong>b) Erik Coenen verwittigen. (De afspraak bij de VDAB is verplicht, dus ze laat het zeker weten voor 6 juli.)</li></ul><p><strong>— Pagina 61: België beter bekeken – artikel (Oefening 6) —</strong></p><p><strong>Oefening 6.1. </strong>Welke titel past het best bij dit artikel?</p><ul><li><strong>Antwoord: </strong>b) Sms’en, bellen en e-mailen achter het stuur: Belgen zijn kampioen!</li></ul><p><strong>Oefening 6.2. </strong>Wat is volgens Wouter Vandenberghe de oorzaak van het probleem?</p><ul><li><strong>Antwoord: </strong>De files (de verkeersopstoppingen). Mensen zijn eraan gewoon geraakt door de files.</li></ul><p><strong>Oefening 6.3. </strong>Wat moet er volgens Wouter gebeuren om het probleem op te lossen?</p><ul><li><strong>Antwoord: </strong>Er moeten meer campagnes komen om mensen te overtuigen hun mobiel uit te schakelen.</li></ul><p><strong>Oefening 6.4. </strong>Wat vind je van deze tekst? (eigen mening)</p><ul><li><strong>Antwoord: </strong>Ik vind deze tekst interessant. Door deze tekst te lezen heb ik iets bijgeleerd. Ik zou deze tekst aan iemand anders aanraden.</li></ul><p><em>   (öğrenci görüşü – örnek)</em></p><p><strong>— Pagina 62: Wat kan ik? – Bol.com (Oefening 1) —</strong></p><p><strong>Oefening 1.1. </strong>De e-mail is …</p><ul><li><strong>Antwoord: </strong>c) een verwittiging dat haar bestelling verzonden wordt.</li></ul><p><strong>Oefening 1.2. </strong>Wat moet Christine doen?</p><ul><li><strong>Antwoord: </strong>c) Niets. Ze heeft gekozen om na ontvangst te betalen, dus ze moet nu niets doen.</li></ul><p><strong>— Pagina 63: Lees de e-mails (Oefening 2 – eigen </strong><strong>inbox</strong><strong>) —</strong></p><p><strong>Oefening 2.1. </strong>Wie heeft de e-mail gestuurd?</p><ul><li><strong>Antwoord: </strong>De e-mail is gestuurd door bol.com (de webshop).</li></ul><p><em>   (</em><em>hayali</em><em> </em><em>senaryo</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>Oefening 2.2. </strong>Waarover gaat de e-mail?</p><ul><li><strong>Antwoord: </strong>De e-mail gaat over mijn bestelling. Mijn pakje is verzonden.</li></ul><p><em>   (hayali – örnek)</em></p><p><strong>Oefening 2.3. </strong>Wat moet je doen?</p><ul><li><strong>Antwoord: </strong>Ik moet niets doen. Ik kan de zending volgen met het Track &amp; Trace-nummer.</li></ul><p><em>   (</em><em>hayali</em><em> – </em><em>örnek</em><em>)</em></p>", "<h2>DEEL 5 – Het dak lekt!</h2><p><strong>— Pagina 68–71: Vakman + advertentie (Oefening 2 en 3) —</strong></p><p>Her SMS için doğru usta ve ilanın harfi (sayfa 70-71’deki ilanlar):</p><p><strong>Oefening 2/3. </strong>Vul de sms aan met de juiste vakman en schrijf de letter van de advertentie.</p><ul><li><strong>Antwoord: </strong>1. de kraan laten vervangen → de loodgieter → advertentie d (ADS Sluyts)</li><li><strong>Antwoord: </strong>2. cv laten installeren → de installateur → e (WILRIT verwarming)</li><li><strong>Antwoord: </strong>3. het slot laten vervangen → de slotenmaker → j (Daniël Van Honsté)</li><li><strong>Antwoord: </strong>4. het dak laten herstellen → de dakwerker → g (Louis Michielse)</li><li><strong>Antwoord: </strong>5. meer stopcontacten laten plaatsen → de elektricien → f (BS-Productions)</li><li><strong>Antwoord: </strong>6. de plafonds laten schilderen → de schilder → a (MB Schilderwerken)</li><li><strong>Antwoord: </strong>7. de slaapkamer laten behangen → de behanger → b (Huis Maria Evers)</li><li><strong>Antwoord: </strong>8. een gebarsten ruit laten vervangen → de glazenmaker → c (JEKARI)</li><li><strong>Antwoord: </strong>9. nieuwe keukenkasten laten maken → de schrijnwerker → h (ASM)</li><li><strong>Antwoord: </strong>10. een nieuwe keukenvloer laten leggen → de vloerder → i (Fr. Le Bon &amp; Zn)</li></ul><p><strong>— Pagina 72–73: Het huurcontract (Oefening 4) —</strong></p><p><strong>Oefening 4.1. </strong>Hoe heet de verhuurder van het appartement?</p><ul><li><strong>Antwoord: </strong>De verhuurder heet Ronny Verstappen.</li></ul><p><strong>Oefening 4.2. </strong>Waar woont de verhuurder?</p><ul><li><strong>Antwoord: </strong>Hij woont in de Kelderstraat 22, 2610 Wilrijk.</li></ul><p><strong>Oefening 4.3. </strong>In welke straat huurt Bert Somers een appartement?</p><ul><li><strong>Antwoord: </strong>In de Trapstraat 15 bus 2, 2610 Wilrijk.</li></ul><p><strong>Oefening 4.4. </strong>Wie krijgt een exemplaar van het huurcontract?</p><ul><li><strong>Antwoord: </strong>Iedere partij krijgt één exemplaar: de huurder(s) en de verhuurder. Er zijn drie exemplaren; het derde is voor de registratie.</li></ul><p><strong>Oefening 4.5. </strong>In welk artikel vind je een beschrijving van het appartement?</p><ul><li><strong>Antwoord: </strong>In Artikel 1.</li></ul><p><strong>Oefening 4.6. </strong>In welke artikels vind je informatie over herstellingen?</p><ul><li><strong>Antwoord: </strong>In Artikel 9 en Artikel 10.</li></ul><p><strong>Oefening 4.7. </strong>Onderstreep de herstellingen die de huurder moet betalen.</p><ul><li><strong>Antwoord: </strong>De huurder betaalt (Artikel 9): schilderwerken, behangen, vervangen van gebarsten of gebroken ruiten, onderhoud van ruiten, lavabo’s, verwarmings-, elektriciteits- en gasinstallaties, deuren en vensters aan de binnenkant, sleutels en sloten, vloerbekleding en rolluiken.</li></ul><p><strong>— Pagina 74–75: Een klachtenbrief lezen en aanvullen (Oefening 5) —</strong></p><p><strong>Oefening 5.1. </strong>Over welk probleem gaat het in de e-mail en de brief?</p><ul><li><strong>Antwoord: </strong>b) De verwarmingsketel is kapot / slaat niet aan. Het is maar 13 °C in huis.</li></ul><p><strong>Oefening 5.2a. </strong>Begroeting (kies uit: Beste / Geachte).</p><ul><li><strong>Antwoord: </strong>Brief (formeel, aan de huisbaas): Geachte heer Verstappen. — E-mail (aan de broer, informeel): Beste Karel.</li></ul><p><strong>Oefening 5.2b. </strong>Slot (kies uit: Wij hopen dat u dit probleem nog deze week oplost. / Laat je me iets weten?).</p><ul><li><strong>Antwoord: </strong>Brief: “Wij hopen dat u dit probleem nog deze week oplost.” — E-mail: “Laat je me iets weten?”</li></ul><p><strong>Oefening 5.2c. </strong>Afscheid (kies uit: Groetjes / Hoogachtend).</p><ul><li><strong>Antwoord: </strong>Brief: Hoogachtend. — E-mail: Groetjes.</li></ul><p><strong>— Pagina 76–79: Klachtenbrief schrijven + e-mail koper (Oefening 6 en 7) — schrijfoefening —</strong></p><p><strong>Oefening 6. </strong>Schrijf een klachtenbrief naar je huisbaas (Arthur De Man). Örnek (2.2 seviyesi):</p><ul><li><strong>Antwoord: </strong>Antwerpen, 10 oktober 2024\nGeachte heer De Man,\nSinds vorige week hebben wij een probleem met de verwarming. De boiler is kapot en er is geen warm water. Ik heb u vorige week gebeld. U hebt gezegd dat u een installateur zou sturen, maar tot nu toe is er niets gebeurd. Wij hopen dat u dit probleem nog deze week oplost.\nHoogachtend,\nManca Benito</li></ul><p><em>   (hayali örnek – öğrenci seviyesi)</em></p><p><strong>Oefening 7. </strong>Schrijf een e-mail terug aan de koper (Jos Smets). Vertel over elk nummer bij de tekening. Örnek:</p><ul><li><strong>Antwoord: </strong>Beste Jos,\nBedankt voor uw e-mail. Ik vertel u graag wat er gerenoveerd is. Eerst heeft de dakwerker het dak hersteld. Daarna heeft de glazenmaker een gebarsten ruit vervangen. Dan heeft de slotenmaker het slot van de voordeur vervangen. De schilder heeft ook de muren geschilderd. Ik hoop dat dit duidelijk is.\nVriendelijke groeten,\nPatrick</li></ul><p><em>   (</em><em>hayali</em><em> </em><em>örnek</em><em> – eerst/daarna/dan + laten </em><em>yapıları</em><em>)</em></p><p><strong>— Pagina 80–81: Het klachtenformulier lezen (Oefening 8) + online klacht (Oefening 9) —</strong></p><p><strong>Oefening 8.1. </strong>Waarom dient Elena een klacht in?</p><ul><li><strong>Antwoord: </strong>d) Omdat de chauffeur onvriendelijk was. (Hij zei “Stap maar af” en deed de deur voor haar neus dicht.)</li></ul><p><strong>Oefening 8.2. </strong>Elena is verontwaardigd. Hoe formuleert ze dat?</p><ul><li><strong>Antwoord: </strong>“Het is een echte schande.”</li></ul><p><strong>Oefening 9. </strong>Kies een situatie en vul het onlineklachtenformulier in. Örnek (afvalcontainer):</p><ul><li><strong>Antwoord: </strong>Naam: Yılmaz  Voornaam: Ali  Adres: Bist 12, 2610 Wilrijk\nKlacht: Het is al de tweede keer dat mijn afvalcontainer niet leeggemaakt is. Ik heb het probleem aan het stadsbestuur gemeld, maar er is niets gedaan. Ik vind het heel vervelend dat de container nog altijd vol is. Kunt u dit snel oplossen?</li></ul><p><em>   (hayali örnek)</em></p><p><strong>— Pagina 82–83: Een goede klachtenbrief? (Oefening 10) —</strong></p><p><strong>Oefening 10.1. </strong>Neem de klachtenbrief op p. 75. Is het een goede klachtenbrief? Waarom (niet)?</p><ul><li><strong>Antwoord: </strong>Ja, het is een goede klachtenbrief. De schrijver zegt duidelijk waarover het gaat (de verwarming werkt niet), beschrijft het probleem objectief met het gevolg (het is maar 13 °C), en sluit beleefd maar dringend af (“Wij hopen dat u dit probleem nog deze week oplost.” + Hoogachtend). Er staan een naam en adres bovenaan.</li></ul><p><em>   (öğrenci değerlendirmesi – örnek)</em></p><p><strong>— Pagina 84: Geef ons uw mening (Oefening 2) —</strong></p><p><strong>Oefening 2. </strong>Wat vind je van deze tekst?</p><ul><li><strong>Antwoord: </strong>Ik vind deze tekst interessant. Door deze tekst te lezen heb ik iets bijgeleerd. Ik zou deze tekst aan iemand anders aanraden.</li></ul><p><em>   (öğrenci görüşü – örnek)</em></p><p><strong>— Pagina 85: Wat kan ik? – Kruiswoordraadsel (Oefening 1) —</strong></p><p><strong>Oefening 1. </strong>Vul de juiste vakman in het kruiswoordraadsel in.</p><p>Horizontaal:</p><ul><li><strong>Antwoord: </strong>4. nieuwe vloer laten leggen → VLOERDER</li><li><strong>Antwoord: </strong>8. stopcontacten laten plaatsen → ELEKTRICIEN</li><li><strong>Antwoord: </strong>9. slaapkamer laten behangen → BEHANGER</li><li><strong>Antwoord: </strong>10. boekenkast laten maken → SCHRIJNWERKER</li></ul><p>Verticaal:</p><ul><li><strong>Antwoord: </strong>1. kraan laten vervangen → LOODGIETER</li><li><strong>Antwoord: </strong>2. slot laten vervangen → SLOTENMAKER</li><li><strong>Antwoord: </strong>3. dak laten herstellen → DAKWERKER</li><li><strong>Antwoord: </strong>5. centrale verwarming laten installeren → INSTALLATEUR</li><li><strong>Antwoord: </strong>6. gang laten schilderen → SCHILDER</li><li><strong>Antwoord: </strong>7. gebarsten ruit laten vervangen → GLAZENMAKER</li></ul><p><strong>— Pagina 86–87: Klachtenbrieven en online klacht schrijven (Oefening 2, 3, 4) — schrijfoefening —</strong></p><p><strong>Oefening 2. </strong>Schrijf een klachtenbrief (huisbaas Leo Krot, Bouwstraat 13, 8400 Oostende). Örnek:</p><ul><li><strong>Antwoord: </strong>Oostende, 12 november 2024\nGeachte heer Krot,\nSinds twee weken lekt het dak van mijn appartement. Als het regent, komt er water binnen in de slaapkamer. Ik heb u gebeld en u hebt beloofd een dakwerker te sturen, maar er is nog niets gebeurd. Ik vind het heel vervelend. Ik hoop dat u dit probleem snel oplost.\nHoogachtend,\nFatma Demir</li></ul><p><em>   (hayali örnek)</em></p><p><strong>Oefening 3. </strong>Schrijf een klachtenbrief (eigen probleem, huisbaas doet niets). Örnek:</p><ul><li><strong>Antwoord: </strong>Geachte heer/mevrouw,\nDe kraan in mijn badkamer lekt al een maand. Ik heb u verwittigd, maar u hebt nog niets gedaan. Het water beschadigt de vloer. Ik hoop dat u snel een loodgieter stuurt.\nHoogachtend,\n(naam)</li></ul><p><em>   (hayali örnek)</em></p><p><strong>Oefening 4. </strong>Dien online een klacht in (niemand kan/wil je helpen). Örnek:</p><ul><li><strong>Antwoord: </strong>Klacht: Er is al maanden lang een put in het voetpad voor mijn woning. Ik heb de gemeentedienst verwittigd, maar er gebeurt niets. Het is gevaarlijk voor voetgangers. Ik vind het een echte schande. Kunt u dit zo snel mogelijk herstellen?</li></ul><p><em>   (</em><em>hayali</em><em> </em><em>örnek</em><em>)</em></p>", "<h2>DEEL 6 – Ik reageer</h2><p><strong>— Pagina 92–94: Lezersbrieven lezen (Oefening 1 t/m 11) —</strong></p><p><strong>Oefening</strong><strong> 1. </strong>Rik Blondeel …</p><ul><li><strong>Antwoord: </strong>b) ergert zich aan de uitvinding. (Hij vindt de hondenhalsband duur en overbodig.)</li></ul><p><strong>Oefening 2. </strong>Onderstreep hoe Rik dit formuleert.</p><ul><li><strong>Antwoord: </strong>“Dat is niet alleen gevaarlijk, het is bovendien verboden! Hondenbaasjes zouden hun hond gewoon aan de leiband moeten houden.”</li></ul><p><strong>Oefening</strong><strong> 3. </strong>Karin Mertens …</p><ul><li><strong>Antwoord: </strong>a) is blij met de uitvinding. (Haar hond was drie dagen vermist; met de uitvinding zou dat niet gebeurd zijn.)</li></ul><p><strong>Oefening 4. </strong>Onderstreep hoe Karin dit formuleert.</p><ul><li><strong>Antwoord: </strong>“Echt schitterend! … U bent een echte dierenvriend, meneer Lantin! In naam van alle ‘baasjes’: bedankt!”</li></ul><p><strong>Oefening 5. </strong>Denk je dat Karin Mertens zo’n halsband zal kopen? Waarom (niet)?</p><ul><li><strong>Antwoord: </strong>Ja, ik denk het. Haar hond was drie dagen vermist. Met zo’n halsband kan ze hem snel terugvinden, dus ze wil hem zeker kopen.</li></ul><p><em>   (</em><em>öğrenci</em><em> </em><em>görüşü</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>Oefening 6. </strong>Tom Verbert …</p><ul><li><strong>Antwoord: </strong>b) is heel blij met het gsm-verbod. (Hij vindt gsm-vrije reizen een schitterend idee.)</li></ul><p><strong>Oefening 7. </strong>Onderstreep hoe Tom dit formuleert.</p><ul><li><strong>Antwoord: </strong>“Ik vind dat een schitterend idee! Ik neem mijn gsm nooit mee op reis.”</li></ul><p><strong>Oefening 8. </strong>Wat is Toms mening?</p><ul><li><strong>Antwoord: </strong>Hij vindt gsm-vrije reizen een schitterend idee. Op vakantie wil hij niet bereikbaar zijn en wil hij van de stilte genieten.</li></ul><p><strong>Oefening</strong><strong> 9. </strong>Lien Somers …</p><ul><li><strong>Antwoord: </strong>c) is tegen het gsm-verbod.</li></ul><p><strong>Oefening 10. </strong>Onderstreep hoe Lien dit formuleert.</p><ul><li><strong>Antwoord: </strong>“Dat kan ik nu echt niet begrijpen. … Volgens mij gaat het reisbureau door deze actie veel klanten verliezen.”</li></ul><p><strong>Oefening 11. </strong>Waarom is dit haar mening?</p><ul><li><strong>Antwoord: </strong>Omdat haar dochter gehandicapt is en bij haar woont. Als er thuis iets gebeurt, wil ze bereikbaar zijn.</li></ul><p><strong>— Pagina 95: Verwijzen en afsluiten (Oefening 3 en 4) —</strong></p><p><strong>Oefening 3. </strong>Hoe verwijzen de schrijvers naar het artikel in de krant? (Omcirkel de juiste letter(s).)</p><ul><li><strong>Antwoord: </strong>a, d en e. (a: “In de krant van … las ik …”; d: “Ik heb uw artikel gelezen over …”; e: “Via deze weg wil ik reageren op het artikel …”.)</li></ul><p><strong>Oefening 4. </strong>Hoe sluiten de schrijvers hun lezersbrief af?</p><ul><li><strong>Antwoord: </strong>Reactie 1 (Rik Blondeel): b) met een wens/advies.</li><li><strong>Antwoord: </strong>Reactie 2 (Karin Mertens): a) met een bedanking.</li><li><strong>Antwoord: </strong>Reactie 3 (Tom Verbert): b) met een wens/advies.</li><li><strong>Antwoord: </strong>Reactie 4 (Lien Somers): c) met haar persoonlijke mening.</li></ul><p><strong>— Pagina 96–97: Een lezersbrief schrijven (Oefening 5) — schrijfoefening —</strong></p><p><strong>Oefening 5. </strong>Schrijf een lezersbrief als reactie op “Gsm-vrij reizen in de Himalaya” (p. 92). Örnek (2.2 seviyesi):</p><ul><li><strong>Antwoord: </strong>Beste redactie,\nIk heb uw artikel gelezen over gsm-vrije reizen in de Himalaya. Ik vind dat een schitterend idee! Op vakantie wil ik niet altijd bereikbaar zijn, want ik wil rust en stilte. Volgens mij zouden meer reisbureaus dit moeten aanbieden.\nMet vriendelijke groet,\nMehmet Yıldız</li></ul><p><em>   (</em><em>hayali</em><em> </em><em>örnek</em><em>)</em></p><p><strong>— Pagina 98–101: Een reactie schrijven op artikel of e-mail (Oefening 6 en 7) — schrijfoefening —</strong></p><p><strong>Oefening 6. </strong>Kies een rol/situatie en schrijf een lezersbrief of reactie. Örnek – reactie op e-mail van de baas (vaste werkuren):</p><ul><li><strong>Antwoord: </strong>Beste meneer Michiels,\nIk wil graag reageren op uw e-mail over de vaste werkuren. Ik ben het er niet helemaal mee eens. Met glijdende werkuren kon ik mijn kinderen eerst naar school brengen. Nu wordt dat moeilijk. Ik hoop dat u hier rekening mee kunt houden.\nMet vriendelijke groet,\n(naam)</li></ul><p><em>   (hayali örnek)</em></p><p><strong>Oefening 7 (p.100). </strong>Reactie op e-mail van de school (verandering van lesdagen). Örnek:</p><ul><li><strong>Antwoord: </strong>Beste mevrouw Somers,\nIk heb uw e-mail gelezen over de verandering van de lesdagen. Dinsdag- en donderdagnamiddag zijn voor mij moeilijk, omdat ik dan werk. Kunt u de les misschien in de voormiddag houden? Bedankt voor uw begrip.\nMet vriendelijke groet,\n(naam)</li></ul><p><em>   (hayali örnek)</em></p><p><strong>— Pagina 102–103: Lezersbrieven – artikel (Oefening 7) —</strong></p><p><strong>Oefening 7.1. </strong>Voldoen de lezersbrieven op p. 93 aan de criteria in de tekst? Waarom (niet)?</p><ul><li><strong>Antwoord: </strong>Ja, grotendeels. De brieven zijn kort, ze pikken in op een artikel in de krant en geven een mening met een argument. Ze zijn beleefd en de schrijvers vermelden hun naam en woonplaats.</li></ul><p><em>   (</em><em>öğrenci</em><em> </em><em>değerlendirmesi</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>Oefening 7.2. </strong>Waarom hebben lezersbrieven een grote impact?</p><ul><li><strong>Antwoord: </strong>Omdat de brievenrubriek tot de meest gelezen onderdelen van kranten en magazines behoort. Een persoon die schrijft, heeft meer invloed dan de duizenden die niets van zich laten horen.</li></ul><p><strong>Oefening 7.3. </strong>Wat vind je van deze tekst?</p><ul><li><strong>Antwoord: </strong>Ik vind deze tekst nuttig en interessant. Door deze tekst te lezen heb ik iets bijgeleerd over het schrijven van een goede lezersbrief.</li></ul><p><em>   (</em><em>öğrenci</em><em> </em><em>görüşü</em><em> – </em><em>örnek</em><em>)</em></p>", "<h2>DEEL 7 – Ik zoek werk!</h2><p><strong>— Pagina 112: Vereisten formuleren (Oefening 2 en 3) —</strong></p><p><strong>Oefening 2/3. </strong>Vul de vereisten aan en raad het beroep. Voorbeelden van de zinnen:</p><ul><li><strong>Antwoord: </strong>1. Ik heb een rijbewijs nodig. (bv. buschauffeur, vrachtwagenchauffeur)</li><li><strong>Antwoord: </strong>6. Ik moet klantvriendelijk zijn, want ik heb veel contact met klanten. (bv. verkoper, kapper)</li><li><strong>Antwoord: </strong>8. Ik moet een goed en verzorgd voorkomen hebben. (bv. kapper, ober)</li><li><strong>Antwoord: </strong>12. Ik moet rustig, kalm kunnen blijven in stresssituaties. (bv. verpleger, dokter)</li></ul><p><strong>— Pagina 113: </strong><strong>Jobadvertenties</strong><strong> – vereisten aankruisen (Oefening 4) —</strong></p><p><strong>Oefening 4. </strong>Welke vereiste hoort bij welke advertentie? (✓)</p><ul><li><strong>Antwoord: </strong>Advertentie 1 – buschauffeur: rijbewijs (D), Nederlands kennen.</li><li><strong>Antwoord: </strong>Advertentie 2 – kinderverzorgster: diploma hebben, ervaring hebben, deeltijds willen werken.</li><li><strong>Antwoord: </strong>Advertentie 3 – elektricien: diploma hebben, ervaring hebben, rijbewijs (B), talen (Frans).</li><li><strong>Antwoord: </strong>Advertentie 4 – kapper: ervaring hebben, deeltijds willen werken.</li><li><strong>Antwoord: </strong>Advertentie 5 – productiearbeider: Nederlands kennen, in 2 ploegen willen werken.</li><li><strong>Antwoord: </strong>Advertentie 6 – arbeider: in het weekend / afwisselend willen werken.</li></ul><p><strong>— Pagina 116: </strong><strong>Jobadvertenties</strong><strong> – eigenschappen aankruisen (Oefening 5) —</strong></p><p><strong>Oefening 5. </strong>Welke eigenschap hoort bij welke advertentie? (✓)</p><ul><li><strong>Antwoord: </strong>Advertentie 1 – vertaler/tolk: in team + zelfstandig kunnen werken, organisatietalent hebben.</li><li><strong>Antwoord: </strong>Advertentie 2 – magazijnier (BUGA): flexibel, ordelijk, stressbestendig zijn, een goed voorkomen hebben.</li><li><strong>Antwoord: </strong>Advertentie 3 – magazijnier (Kris De Leneer): zelfstandig kunnen werken, flexibel zijn, organisatietalent hebben.</li><li><strong>Antwoord: </strong>Advertentie 4 – technieker: zelfstandig + ordelijk kunnen werken, klantvriendelijk zijn.</li><li><strong>Antwoord: </strong>Advertentie 5 – lasser: flexibel en gemotiveerd zijn.</li></ul><p><strong>— Pagina 119: Vereisten opschrijven (Oefening 6) — schrijfoefening —</strong></p><p><strong>Oefening 6. </strong>Schrijf de vereisten op waaraan jij kan voldoen. Örnek:</p><ul><li><strong>Antwoord: </strong>Ik ben flexibel. Ik wil in het weekend werken. Ik ben bereid om in ploegen te werken. Ik kan in team werken. Ik heb een rijbewijs.</li></ul><p><em>   (öğrenci kendi cevabı – örnek)</em></p><p><strong>— Pagina 120–122: Is dit een gepaste job? (Oefening 7) —</strong></p><p><strong>Oefening 7.1. </strong>Dirk – verkoper bij Delhaize?</p><ul><li><strong>Antwoord: </strong>b) Nee. Delhaize vraagt zaterdagwerk, maar Dirk wil het weekend vrijhouden.</li></ul><p><strong>Oefening 7.2. </strong>Paulo – administratief bediende bij de gemeente Kontich?</p><ul><li><strong>Antwoord: </strong>b) Nee. Men vraagt een diploma hoger secundair onderwijs, maar Paulo heeft enkel lager secundair.</li></ul><p><strong>Oefening</strong><strong> 7.3. </strong>Wim – productiearbeider bij Arets Graphics?</p><ul><li><strong>Antwoord: </strong>a) Ja. Hij woont in Niel, werkt graag hard en heeft geen probleem met ploegenwerk.</li></ul><p><strong>Oefening 7.4. </strong>Ingrid – verkoopster bij Del Rey?</p><ul><li><strong>Antwoord: </strong>b) Nee. Men zoekt iemand van maximaal 40 jaar, maar Ingrid is 45.</li></ul><p><strong>Oefening 7.5. </strong>Cristina – schoonmaakster bij Euroclean?</p><ul><li><strong>Antwoord: </strong>b) Nee. Men zoekt bij voorkeur iemand die Nederlands spreekt en ervaring heeft; Cristina spreekt enkel Roemeens.</li></ul><p><strong>Oefening 7.6. </strong>Op welke manier kan je reageren op de jobadvertenties?</p><ul><li><strong>Antwoord: </strong>Je kan schriftelijk solliciteren (een brief + cv sturen), bellen, faxen, mailen of je persoonlijk aanbieden.</li></ul><p><strong>— Pagina 123: Het cv van Samira – rubrieken (Oefening 8) —</strong></p><p><strong>Oefening 8. </strong>Schrijf de letter van de juiste rubriek naast het cv.</p><ul><li><strong>Antwoord: </strong>1e blok (naam, adres, geboren, nationaliteit, rijbewijs) → c) PERSONALIA</li><li><strong>Antwoord: </strong>2e blok (verkoopster, onderhoudsmedewerkster, administratief bediende) → d) WERKERVARING</li><li><strong>Antwoord: </strong>3e blok (Sint-Lutgardis, 7de specialisatiejaar, A2) → a) OPLEIDING</li><li><strong>Antwoord: </strong>4e blok (Nederlands, Frans, Engels, Arabisch) → f) TALENKENNIS</li><li><strong>Antwoord: </strong>5e blok (Word, Excel, Access) → e) COMPUTERKENNIS</li><li><strong>Antwoord: </strong>6e blok (enthousiast, flexibel, ordelijk, klantvriendelijk) → b) VAARDIGHEDEN</li><li><strong>Antwoord: </strong>7e blok (onmiddellijk beschikbaar) → g) VARIA</li></ul><p><strong>— Pagina 124–125: Eigen cv + onlinesollicitatieformulier (Oefening 9 en 10) — schrijfoefening —</strong></p><p><strong>Oefening 9/10. </strong>Stel je eigen cv op en vul het onlinesollicitatieformulier in. Örnek personalia:</p><ul><li><strong>Antwoord: </strong>PERSONALIA: Mehmet Yıldız – Kerkstraat 10, 3600 Genk – 0470 00 00 00 – mehmet@gmail.com – geboren 01/01/1990 – Belgische nationaliteit – rijbewijs B.\nWERKERVARING: magazijnier (2019–nu). OPLEIDING: secundair onderwijs. TALENKENNIS: Turks (moedertaal), Nederlands (goed), Engels (basis). VARIA: onmiddellijk beschikbaar.</li></ul><p><em>   (</em><em>hayali</em><em> </em><em>örnek</em><em> – </em><em>kişisel</em><em> </em><em>bilgilerle</em><em> </em><em>doldurulur</em><em>)</em></p><p><strong>— Pagina 126–127: De beste sollicitatiebrief kiezen (Oefening 11) —</strong></p><p><strong>Oefening 11. </strong>Kies de beste inleiding, het beste midden en het beste slot.</p><ul><li><strong>Antwoord: </strong>Beste inleiding: 1. (“Naar aanleiding van uw vacature in De Standaard zou ik mij graag kandidaat stellen …” – beleefd en concreet.)</li><li><strong>Antwoord: </strong>Beste midden: 1. (Positief: vermeldt stage, klantvriendelijkheid en bereidheid om ’s avonds en in het weekend te werken. De andere twee zijn negatief: ontslagen / weekendwerk onmogelijk.)</li><li><strong>Antwoord: </strong>Beste slot: 3. (“Graag had ik u in een persoonlijk gesprek overtuigd van mijn motivatie en capaciteiten.” – vraagt om een gesprek.)</li></ul><p><strong>— Pagina 128–129: Sollicitatiemail en profiel van Jos Doren (Oefening 12 en 13) —</strong></p><p><strong>Oefening 12. </strong>Wat ontbreekt er in de sollicitatiemail van Jos Doren?</p><ul><li><strong>Antwoord: </strong>Het cv ontbreekt in de bijlage. In de mail staat “sollicitatiebrief en cv”, maar als bijlage is er maar 1 document (de sollicitatiebrief). Het cv moet ook toegevoegd worden.</li></ul><p><strong>Oefening 13.1. </strong>Welke elementen van het profiel staan in de sollicitatiebrief van Jos Doren?</p><ul><li><strong>Antwoord: </strong>Hij is klantvriendelijk, hij heeft ervaring (stage in restaurant De Toren via de VDAB) en hij is bereid om ’s avonds en in het weekend te werken.</li></ul><p><strong>Oefening 13.2 / 14 / 15. </strong>Zet ✓ bij wat op jou van toepassing is en schrijf een eigen sollicitatiebrief/e-mail. Örnek slot van de brief:</p><ul><li><strong>Antwoord: </strong>“Graag had ik u in een persoonlijk gesprek overtuigd van mijn motivatie. Met vriendelijke groet, (naam).”</li></ul><p><em>   (hayali örnek)</em></p><p><strong>— Pagina 132–133: Sollicitatietest (Oefening 16) —</strong></p><p><strong>Oefening 16. </strong>Doe de sollicitatietest en tel je antwoorden.</p><ul><li><strong>Antwoord: </strong>Bu bir kişisel testtir; her soruda kendine en uygun A/B/C seçilir. Sonuç: en çok A → “Je weet wat je moet doen, je bereidt je goed voor.” En çok B → “Je reageert spontaan; oefen een gesprek.” En çok C → “Je bent voorzichtig; durf jezelf te zijn.”</li></ul><p><em>   (</em><em>kişisel</em><em> test – </em><em>örnek</em><em> </em><em>yorum</em><em>)</em></p><p><strong>— Pagina 134: Artikel: te weinig vakmensen (Oefening 17) —</strong></p><p><strong>Oefening 17.1. </strong>Welke titel past bij het artikel?</p><ul><li><strong>Antwoord: </strong>b) Te weinig vakmensen in België.</li></ul><p><strong>Oefening 17.2. </strong>Wat is jouw beroep?</p><ul><li><strong>Antwoord: </strong>Ik ben magazijnier. / Ik zoek werk als verkoper.</li></ul><p><em>   (</em><em>kişisel</em><em> – </em><em>örnek</em><em>)</em></p><p><strong>— Pagina 135: Artikel: knelpuntberoep (Oefening 18) —</strong></p><p><strong>Oefening 18.1. </strong>Wat is een knelpuntberoep?</p><ul><li><strong>Antwoord: </strong>Een knelpuntberoep is een beroep waarvoor de vacatures moeilijk ingevuld geraken – een job waarvoor bedrijven moeilijk geschikt personeel vinden (bv. lasser, schrijnwerker, verpleegkundige).</li></ul><p><strong>Oefening 18.2–18.5. </strong>Zoek een voorbeeld en waar je informatie over de opleidingen vindt.</p><ul><li><strong>Antwoord: </strong>Een voorbeeld van een knelpuntberoep: verpleegkundige of lasser. Informatie over de opleidingen vind je op www.vdab.be.</li></ul><p><strong>— Pagina 136: Wat kan ik? – Kruiswoordraadsel (Oefening 1) —</strong></p><p><strong>Oefening 1. </strong>Vul het kruiswoordraadsel in.</p><ul><li><strong>Antwoord: </strong>1. iemand met veel orde → ORDELIJK</li><li><strong>Antwoord: </strong>2. moedertaal Nederlands → NEDERLANDSTALIG</li><li><strong>Antwoord: </strong>3. wil heel graag werken → GEMOTIVEERD</li><li><strong>Antwoord: </strong>4. verkoopster in klerenwinkel → KLANTVRIENDELIJK</li><li><strong>Antwoord: </strong>5. een chauffeur moet een … hebben → RIJBEWIJS</li><li><strong>Antwoord: </strong>6. zonder vaste werkuren → FLEXIBEL</li><li><strong>Antwoord: </strong>7. de ene week voormiddag, de andere namiddag → PLOEGEN</li><li><strong>Antwoord: </strong>8. kapper moet een … voorkomen hebben → VERZORGD</li><li><strong>Antwoord: </strong>Oplossing onder de pijl (verticaal) – “Wat heb je dikwijls nodig als je werk zoekt?”: een DIPLOMA / ERVARING (het verticale woord dat uit de letters ontstaat).</li></ul><p><em>   (</em><em>dikey</em><em> </em><em>çözüm</em><em> </em><em>sözcüğü</em><em> – </em><em>kitaptaki</em><em> </em><em>harflere</em><em> </em><em>göre</em><em> </em><em>okunur</em><em>)</em></p><p><strong>— Pagina 137: VDAB-formulier aanvullen (Oefening 2) —</strong></p><p><strong>Oefening 2. </strong>Vul het formulier van de VDAB aan (Tony Galenco is chauffeur geworden).</p><ul><li><strong>Antwoord: </strong>Naam: Galenco – Voornaam: Tony. (1) Ik werk sedert 10/08/20.. bij (werkgever) te (plaats) als chauffeur, gedurende 38 uren/week. Datum en handtekening: Galenco. (Hij kruist aan dat hij werk gevonden heeft.)</li></ul>"], "labels": ["Giriş", "DEEL 1", "DEEL 2", "DEEL 3", "DEEL 4", "DEEL 5", "DEEL 6", "DEEL 7"], "type": "html"}};
let view = 'home';
const cur = { book:0, notes:0, exercises:0 };

function showView(v){
  view = v;
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  const tab = document.getElementById('tab-'+v); if(tab) tab.classList.add('active');
  const pager = document.getElementById('pager');
  pager.style.display = (v==='home') ? 'none' : 'flex';
  if(v!=='home') render();
  window.scrollTo(0,0);
}

function render(){
  const d = DATA[view];
  const i = cur[view];
  const holder = document.getElementById(view+'-holder');
  if(d.type==='img'){
    holder.innerHTML = '<img src="'+encodeURI(d.pages[i])+'" alt="Pagina '+d.labels[i]+'" '+
      'onerror="this.insertAdjacentHTML(\'afterend\',\'<p style=&quot;color:#c0392b&quot;>Resim bulunamadı: '+d.pages[i]+'</p>\')">';
  } else {
    holder.innerHTML = d.pages[i];
  }
  document.getElementById('page-total').textContent = d.pages.length;
  const inp = document.getElementById('page-input');
  inp.value = i+1; inp.max = d.pages.length;
  document.getElementById('btn-prev').disabled = (i<=0);
  document.getElementById('btn-next').disabled = (i>=d.pages.length-1);
  document.getElementById('page-label').textContent =
     (d.type==='img' ? ('Kitap s. '+d.labels[i]) : (d.labels[i]||''));
  window.scrollTo(0,0);
}
function prevPage(){ if(cur[view]>0){ cur[view]--; render(); } }
function nextPage(){ if(cur[view]<DATA[view].pages.length-1){ cur[view]++; render(); } }
function jumpPage(){
  const inp = document.getElementById('page-input');
  let n = parseInt(inp.value,10);
  const max = DATA[view].pages.length;
  if(isNaN(n)) n = 1;
  n = Math.max(1, Math.min(max, n));
  cur[view] = n-1; render();
}
document.addEventListener('keydown', e=>{
  if(view==='home') return;
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowLeft') prevPage();
  if(e.key==='ArrowRight') nextPage();
});
showView('home');
</script>
</body>
</html>
